<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Elena Syrtceva — 3D Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0ea;
      --dark: #2a2018;
      --accent: #7a6045;
      --light: #ede6dc;
      --text: #3a2e20;
      --muted: #9a8a78;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      background: rgba(245, 240, 234, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(122, 96, 69, 0.12);
    }

    nav .logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 18px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 36px;
    }

    nav ul a {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
      transition: color 0.3s;
      cursor: pointer;
      font-weight: 400;
    }

    nav ul a:hover { color: var(--dark); }

    /* HERO */
    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: var(--dark);
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 10%;
      opacity: 0.35;
      display: block;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 80px 48px 64px;
      background: rgba(0,0,0,0.4);
    }

    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(56px, 8vw, 110px);
      line-height: 0.95;
      color: #fff;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    .hero-name em {
      font-style: italic;
      color: rgba(255,255,255,0.7);
    }

    .hero-tags {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-tag {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* SECTION LABEL */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--accent);
      opacity: 0.25;
    }

    /* PROJECTS GRID */
    #portfolio {
      padding: 96px 48px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--dark);
    }

    .project-card img.thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease, opacity 0.4s ease;
    }

    .project-card:hover img.thumb {
      transform: scale(1.04);
      opacity: 0.6;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px;
      background: linear-gradient(to top, rgba(30,20,10,0.85) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .project-card:hover .card-overlay { opacity: 1; }

    .card-number {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 400;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .card-btn {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 4px;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: 'Jost', sans-serif;
    }

    .card-title-static {
      padding: 16px 20px;
      background: var(--light);
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: var(--text);
      display: none;
    }

    /* MODAL BASE */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 15, 10, 0.97);
      z-index: 200;
      overflow-y: auto;
    }

    .modal-close-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 12px 20px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .modal-close-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* GALLERY */
    .gallery-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 32px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 48px;
    }

    .gallery-header > div {
      flex: 1;
      min-width: 0;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: #fff;
      line-height: 1.1;
    }

    .gallery-desc {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,0.45);
      max-width: none;
      width: 100%;
      margin-top: 12px;
      font-weight: 200;
    }

    .gallery-desc-block + .gallery-desc-block {
      margin-top: 14px;
    }

    .gallery-desc-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4px;
    }

    .gallery-desc-bilingual {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
      width: 100%;
    }

    .gallery-desc-bilingual .gallery-desc-block + .gallery-desc-block {
      margin-top: 0;
    }

    .gallery-images img {
      width: 100%;
      display: block;
      margin-bottom: 4px;
      border-radius: 2px;
    }

    .gallery-tags {
      margin-top: 16px;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.42);
    }

    .gallery-tags-label {
      display: inline-block;
      margin-right: 10px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    /* ABOUT MODAL */
    .about-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 32px;
    }

    .about-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 56px;
    }

    .about-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: #fff;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: start;
      margin-bottom: 56px;
    }

    .about-photo {
      width: 100%;
      border-radius: 2px;
      object-fit: cover;
    }

    .about-certificate {
      width: 100%;
      border-radius: 4px;
      display: block;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    }

    .about-lead {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 1.6;
      color: #fff;
      margin-bottom: 24px;
    }

    .about-body {
      font-size: 14px;
      line-height: 1.9;
      color: rgba(255,255,255,0.5);
      font-weight: 300;
      margin-bottom: 16px;
    }

    .about-tools {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.3);
      margin-top: 22px;
      text-align: center;
    }

    .about-diploma {
      width: 100%;
      max-width: none;
      border-radius: 4px;
      display: block;
      margin-top: 0;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 44px rgba(0,0,0,0.35);
    }

    /* CONTACT */
    #contact {
      background: var(--dark);
      padding: 96px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #contact::before {
      content: 'ES';
      position: absolute;
      font-family: 'Cormorant Garamond', serif;
      font-size: 280px;
      font-weight: 300;
      color: rgba(255,255,255,0.03);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      letter-spacing: -0.05em;
    }

    .contact-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }

      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 5vw, 64px);
      font-weight:
